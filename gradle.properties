# Wajib: semua dependency project ini AndroidX.
android.useAndroidX=true
# R class non-transitif (default AGP 8, ditulis eksplisit biar jelas).
android.nonTransitiveRClass=true
# Heap + encoding untuk Gradle daemon.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Cache antar build biar rebuild lebih cepat.
org.gradle.caching=true
# Code style Kotlin resmi.
kotlin.code.style=official
